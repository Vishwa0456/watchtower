[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "watchtower"
version = "0.1.0"
description = "System health monitor with configurable, safe-by-default auto-remediation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "psutil>=5.9,<6.0",
    "PyYAML>=6.0,<7.0",
    "requests>=2.31,<3.0",
    "Flask>=3.0,<4.0",
    "prometheus-client>=0.20,<0.21",
]

[project.scripts]
watchtower = "watchtower.cli:main"

[tool.setuptools.packages.find]
include = ["watchtower*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
